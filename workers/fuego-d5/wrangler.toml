name = "fuego-d5"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Base de conocimiento vectorial. Crear con:
#   npx wrangler vectorize create mjd5-kb --dimensions=768 --metric=cosine
[[vectorize]]
binding = "VECTORIZE"
index_name = "mjd5-kb"

[ai]
binding = "AI"

[vars]
# Sin tarjeta: 10.000 neuronas/día gratis. Cambiar solo si se supera el tope.
LLM_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
LLM_FALLBACK = "@cf/meta/llama-3.2-3b-instruct"
EMBED_MODEL = "@cf/baai/bge-base-en-v1.5"
TOP_K = "5"

# Orígenes permitidos, separados por coma. Dejar "*" solo en local.
ALLOWED_ORIGINS = "http://localhost:5500,http://127.0.0.1:5500"

# Secreto para /api/admin/ingest:
#   npx wrangler secret put INGEST_TOKEN